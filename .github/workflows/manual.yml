
name: ZAM AI Android APK Builder

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Android project folder inside repository"
        required: true
        default: "."
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            gradle assembleDebug
          else
            echo "Android Gradle project not found in $PROJECT_DIR"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAM-AI-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
